services:
  - type: web
    name: databasechatai
    runtime: docker
    plan: free         # gemma4:31b-cloud runs on Ollama's servers, not in this container, so Free's RAM is no longer the blocker — auth is. See DEPLOY.md.
    dockerfilePath: ./Dockerfile
    envVars:
      - key: OLLAMA_MODEL
        value: gemma4:31b-cloud
      - key: OLLAMA_BASE_URL
        value: http://127.0.0.1:11434
      - key: OLLAMA_MODELS
        value: /var/lib/ollama-models   # no disk on Free — this resets on every restart/spin-down
      - key: OLLAMA_API_KEY
        sync: false   # set manually in Render's dashboard (Environment tab) — get one at https://ollama.com/settings/keys. Required for gemma4:31b-cloud; without it every chat call 401s.
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        sync: false   # set manually in Render's dashboard — login is refused until this is set.
      - key: SECRET_KEY
        generateValue: true   # signs session cookies; stable across restarts so users stay logged in.
