services:
  - type: web
    name: databasechatai
    runtime: docker
    plan: free         # 512MB RAM, no disk — gemma4:e4b will very likely OOM on startup, see DEPLOY.md
    dockerfilePath: ./Dockerfile
    envVars:
      - key: OLLAMA_MODEL
        value: gemma4:e4b
      - key: OLLAMA_BASE_URL
        value: http://127.0.0.1:11434
      - key: OLLAMA_MODELS
        value: /var/lib/ollama-models   # no disk on Free — this resets on every restart/spin-down
